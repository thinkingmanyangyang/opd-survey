site_name: On-Policy Distillation 调研手册
docs_dir: site_src
site_dir: site
use_directory_urls: false
theme:
  name: material
  language: zh
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: 暗色 }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: 亮色 }
  features:
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
plugins:
  - search
  - glightbox
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: underscore
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-svg.js
nav:
  - 总览: index.md
  - 'T1 · On-Policy Distillation 核心 / 自蒸馏': T1.md
  - 'T2 · Tool-Agent / 多轮': T2.md
  - 'T3 · GFT 统一 SFT-RL & GRPO-RLVR': T3.md
  - 'T4 · 思维链-Token 级 / MTP': T4.md
