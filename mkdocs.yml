site_name: On-Policy Distillation 调研手册
docs_dir: site_src
site_dir: site
theme:
  name: material
  language: zh
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: 暗色 }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: 亮色 }
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
plugins:
  - search
  - glightbox
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js
